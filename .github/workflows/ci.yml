name: CI

on:
    pull_request: ~
    push:
        branches: [ "main" ]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    static-analysis:
        name: Static Analysis
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    ini-values: date.timezone=UTC, memory_limit=-1, max_execution_time=-1
                    tools: vimeo/psalm
                    coverage: none

            -   name: Composer install
                uses: ramsey/composer-install@v4

            -   name: Psalm
                run: psalm --no-progress || psalm --output-format=github --no-progress

    matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.generate.outputs.matrix }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Generate matrix
                id: generate
                run: |
                    echo "matrix=$(php .github/matrix.php | jq -c .)" >> $GITHUB_OUTPUT

    test:
        needs: matrix
        name: Test PHP ${{ matrix.php }} on ${{ matrix.os }}${{ matrix.coverage && '*' || '' }} (Symfony ${{ matrix.symfony }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

        steps:
            -   name: Configure git to avoid issues with line endings
                if: ${{ runner.os == 'Windows' }}
                run: git config --global core.autocrlf false

            -   name: Configure GNU tar on windows
                if: ${{ runner.os == 'Windows' }}
                shell: cmd
                run: |
                    echo "Adding GNU tar to PATH"
                    echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"

            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    # @see RepositoryIntrospector at scrutinizer-ci/ocular GitHub repository
                    fetch-depth: ${{ matrix.coverage && 10 || 1 }}

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    ini-values: date.timezone=UTC, memory_limit=-1, max_execution_time=-1
                    tools: phpunit-bridge
                    coverage: ${{ matrix.coverage || 'none' }}

            -   name: Setup Symfony version
                if: ${{ matrix.symfony }}
                shell: bash
                run: |
                    composer global config  --ansi --no-interaction --no-plugins allow-plugins.symfony/flex true
                    composer global require --ansi --no-interaction --no-plugins --no-scripts symfony/flex
                    composer        config  --ansi --no-interaction extra.symfony.require "${{ matrix.symfony }}.*"

            -   name: Setup ocubom/twig-svg-extension version
                if: ${{ matrix.twig-svg-extension }}
                shell: bash
                run: |
                    composer require --ansi --no-interaction --no-plugins --no-scripts --dev --no-update ocubom/twig-svg-extension:^${{ matrix.twig-svg-extension }}

            -   name: Composer install
                uses: ramsey/composer-install@v4
                env:
                    SYMFONY_REQUIRE: ${{ matrix.symfony && matrix.symfony || '' }}
                with:
                    composer-options: ${{ matrix.composer-options }}
                    dependency-versions: ${{ matrix.dependencies }}

            -   name: Run test suite
                run: simple-phpunit ${{ matrix.coverage && ' --coverage-clover=coverage.xml ' || '' }}

            -   name: Upload coverage to Scrutinizer
                if: ${{ matrix.coverage }}
                uses: sudo-bot/action-scrutinizer@latest
                with:
                    cli-args: "--format=php-clover coverage.xml --revision=${{ github.event.pull_request.head.sha || github.sha }}"
