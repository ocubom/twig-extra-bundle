name: CI

on:
    pull_request: ~
    push:
        branches: [ "main" ]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    static-analysis:
        name: Static Analysis
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    ini-values: date.timezone=UTC, memory_limit=-1, max_execution_time=-1
                    coverage: none

            -   name: Composer install
                uses: ramsey/composer-install@v4

            -   name: Install PHPUnit
                run: vendor/bin/simple-phpunit --version

            -   name: PHPStan
                run: vendor/bin/phpstan analyse --error-format=github

    test:
        needs: matrix
        name: PHP ${{ matrix.php }} on ${{ matrix.os }}${{ matrix.coverage && '*' || '' }} (Symfony ${{ matrix.symfony }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
        env:
            OS: ${{ matrix.os }}
            PHP: ${{ matrix.php }}
        steps:
            -   name: Configure git to avoid issues with line endings
                if: ${{ runner.os == 'Windows' }}
                run: git config --global core.autocrlf false

            -   name: Configure GNU tar on windows
                if: ${{ runner.os == 'Windows' }}
                shell: cmd
                run: echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"

            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    # @see RepositoryIntrospector at scrutinizer-ci/ocular GitHub repository
                    fetch-depth: ${{ matrix.coverage && 10 || 1 }}

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    ini-values: date.timezone=UTC, memory_limit=-1, max_execution_time=-1
                    coverage: ${{ matrix.coverage || 'none' }}

            -   name: Setup Symfony version
                if: ${{ matrix.symfony }}
                shell: bash
                run: |
                    composer global config  --ansi --no-interaction --no-plugins allow-plugins.symfony/flex true
                    composer global require --ansi --no-interaction --no-plugins --no-scripts symfony/flex
                    composer        config  --ansi --no-interaction extra.symfony.require "${{ matrix.symfony }}.*"

            -   name: Setup ocubom/twig-svg-extension version
                if: ${{ matrix.twig-svg-extension }}
                shell: bash
                env:
                    COMPOSER_NO_BLOCKING: 1
                run: composer require --ansi --no-interaction --no-plugins --no-scripts --dev --no-update ocubom/twig-svg-extension:^${{ matrix.twig-svg-extension }}

            -   name: Composer install
                uses: ramsey/composer-install@v4
                env:
                    SYMFONY_REQUIRE: ${{ matrix.symfony || '' }}
                    COMPOSER_NO_BLOCKING: 1
                with:
                    composer-options: ${{ matrix.composer-options }}
                    dependency-versions: ${{ matrix.dependencies }}

            -   name: Run test suite
                run: vendor/bin/simple-phpunit --log-junit junit.xml ${{ matrix.coverage && ' --coverage-clover=coverage.xml ' || '' }}

            -   name: Upload coverage to Codecov
                if: ${{ matrix.coverage }}
                uses: codecov/codecov-action@v7
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    env_vars: OS,PHP,MINIFIER

            -   name: Upload test results to Codecov
                if: ${{ !cancelled() }}
                uses: codecov/codecov-action@v7
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    env_vars: OS,PHP,MINIFIER
                    files: ./junit.xml
                    report_type: test_results

    matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.generate.outputs.matrix }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Generate matrix
                id: generate
                run: |
                    echo "matrix=$(php .github/matrix.php | jq -c .)" >> $GITHUB_OUTPUT
